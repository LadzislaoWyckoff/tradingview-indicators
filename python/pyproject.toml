[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garchlab"
version = "0.1.0"
description = "GARCH-family volatility modelling, forecasting and backtesting for equity index returns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
download = ["yfinance>=0.2"]
dev = ["pytest>=7.0"]

[project.scripts]
garchlab = "garchlab.cli:main"

[tool.setuptools]
packages = ["garchlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
